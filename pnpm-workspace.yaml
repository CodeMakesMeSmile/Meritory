packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true

overrides:
  # drizzle-kit lists it but never loads it, and it pins an esbuild with a known flaw
  "drizzle-kit>@esbuild-kit/esm-loader": "-"
  # 13.0.7 has the abort fix and stays inside Expo's ^13 range. Remove with MER-49
  "glob@": 13.0.7

# pnpm holds back releases younger than a day. `expo install` pins the newest SDK patches
minimumReleaseAgeExclude:
  - "@expo/env@2.5.4"
  - "@expo/log-box@58.0.15"
  - "@expo/metro-runtime@58.0.17"
  - expo-constants@58.0.15
  - expo-linking@58.0.16
  - expo-router@58.0.30
  - "@expo/cli@58.1.19"
  - "@expo/config-plugins@58.0.12"
  - "@expo/config@58.0.11"
  - "@expo/fingerprint@0.21.9"
  - "@expo/inline-modules@0.2.9"
  - "@expo/local-build-cache-provider@58.0.11"
  - "@expo/metro-config@58.0.21"
  - "@expo/prebuild-config@58.0.19"
  - "@expo/router-server@58.0.21"
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo@58.0.23
  - "@next/env@16.4.5"
  - "@next/swc-darwin-arm64@16.4.5"
  - "@next/swc-darwin-x64@16.4.5"
  - "@next/swc-linux-arm64-gnu@16.4.5"
  - "@next/swc-linux-arm64-musl@16.4.5"
  - "@next/swc-linux-x64-gnu@16.4.5"
  - "@next/swc-linux-x64-musl@16.4.5"
  - "@next/swc-win32-arm64-msvc@16.4.5"
  - "@next/swc-win32-x64-msvc@16.4.5"
  - next@16.4.5
