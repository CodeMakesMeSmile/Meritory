# Local services for development. Start with `pnpm services:up`.
name: meritory

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: meritory
      POSTGRES_PASSWORD: meritory
      POSTGRES_DB: meritory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meritory -d meritory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage. Stands in for the private S3 bucket used in AWS.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: meritory
      RUSTFS_SECRET_KEY: meritory-local-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - storage-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the local bucket once storage is up, then exits
  storage-init:
    image: amazon/aws-cli:2.39.4
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: meritory
      AWS_SECRET_ACCESS_KEY: meritory-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://storage:9000 s3 mb s3://meritory-local || true
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # inbox UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  storage-data:
