name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A fresh, empty database for each run, matching docker-compose.yml
      postgres:
        # Dependabot only updates docker-compose.yml, so bump this with it
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: meritory
          POSTGRES_PASSWORD: meritory
          POSTGRES_DB: meritory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meritory -d meritory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # Only GitHub-made actions are allowed, so pnpm comes from npm at the version in package.json
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://meritory:meritory@localhost:5432/meritory
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://meritory:meritory@localhost:5432/meritory
      # Warns about facts that need a recheck, without failing the run
      - run: pnpm content:recheck
      - run: pnpm --filter @meritory/web build
