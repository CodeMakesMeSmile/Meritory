name: Images

# Builds the web, api, and worker images once CI has passed on main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Both are for the build attestation
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, worker]
    env:
      IMAGE: ghcr.io/codemakesmesmile/meritory-${{ matrix.app }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Only GitHub-made actions are allowed, so the images are built with plain docker
      - run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}

      - run: docker build --file "apps/${{ matrix.app }}/Dockerfile" --tag "$IMAGE:$SHA" --tag "$IMAGE:staging" .

      - run: docker push "$IMAGE:$SHA"
      - run: docker push "$IMAGE:staging"

      - id: digest
        run: echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SHA" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
