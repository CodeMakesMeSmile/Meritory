- id: why-adjacency-list
  skill: adjacency-list
  asks: why
  type: prompt
  prompt: A graph comes as a list of edges. Why build an adjacency list before searching it?
  reworded: What does turning an edge list into an adjacency list save you when you search a graph?
  points:
    - In an edge list, finding one node's neighbours means scanning every edge.
    - A search asks for neighbours once per node, so that would cost O(n × m).
    - Building the list once is O(n + m), and then each node's neighbours are ready to read.
  misconception: That the search can just loop over the edge list each time it needs a node's neighbours.
  lesson:
    title: Pay once, read cheaply
    explanation: One pass over the edges files each edge under its node, or under both nodes when it goes both ways. After that, the whole search is O(n + m).
- id: shared-list-trap
  skill: adjacency-list
  asks: what
  type: pick-one
  prompt: "What goes wrong with `const neighbours = new Array(n).fill([])` when building an adjacency list?"
  reworded: "Filling an array with `[]` to make an empty list per node has a catch. What is it?"
  options:
    - text: Every slot holds the same list, so every node ends up with every edge
      correct: true
      reason: "`fill` puts the one array it was given into every slot."
    - text: The lists start out with a 0 in them
      reason: They start empty. The trouble is that they're all one list.
    - text: The array is too short by one
      reason: It has n slots, one per node from 0 to n - 1.
  lesson:
    title: One fresh list per node
    explanation: "Use `Array.from({ length: n }, () => [])` in TypeScript, or `[[] for _ in range(n)]` in Python, so each node gets its own list."
- id: when-list-or-matrix
  skill: adjacency-list
  asks: when
  type: matching
  prompt: Match each graph to the layout that suits it.
  reworded: Which way of storing the graph fits each of these cases best?
  matchHeading: Layout
  matchName: a layout
  pairs:
    - item: A road network with 100,000 towns and a few roads from each
      match: An adjacency list
    - item: 50 people where you often ask whether two of them know each other
      match: An adjacency matrix
    - item: A grid of cells where each cell touches the cells beside it
      match: The grid itself, with steps to each neighbour
  extraMatches:
    - A single sorted list of nodes
  lesson:
    title: Memory against quick answers
    explanation: A matrix answers "is there an edge?" in O(1) but needs n² memory. A list needs only O(n + m). A grid already says who's next to whom.
- id: why-mark-seen-graph
  skill: graph-dfs
  asks: why
  type: prompt
  prompt: A tree walk needs no record of visited nodes. Why does a search of a graph need one?
  reworded: What goes wrong if a graph search doesn't keep track of the nodes it has already visited?
  points:
    - A graph can have cycles, so a path can lead back to a node already visited.
    - Without a record, the search goes round a cycle forever, or repeats huge amounts of work.
    - In a tree there's exactly one path to each node, so nothing is ever reached twice.
  lesson:
    title: Graphs loop back
    explanation: Mark each node as seen when it's first found. Then every node is handled once, and the search is O(n + m).
- id: when-own-stack
  skill: graph-dfs
  asks: when
  type: pick-one
  prompt: When should a depth-first search keep its own stack instead of using recursion?
  reworded: In which case is a recursive depth-first search risky?
  options:
    - text: When a path through the graph can be thousands of nodes long
      correct: true
      reason: Recursion uses one call per node on the current path, and Python stops at about 1,000 by default.
    - text: Whenever the graph has a cycle
      reason: The seen set handles cycles either way. Depth is what matters.
    - text: Only when the graph is undirected
      reason: Directed graphs can have long paths too.
  lesson:
    title: Depth sets the risk
    explanation: A grid that's one big region or a long chain of nodes can make the path as long as the whole graph. Your own stack has no such limit.
- id: count-parts-steps
  skill: graph-dfs
  asks: what
  type: ordering
  prompt: Put the steps for counting the separate parts of a graph in order.
  reworded: In what order do you count how many connected groups a graph has?
  steps:
    - Build the adjacency list and a seen list that's all false.
    - Go through the nodes from 0 to n - 1.
    - Skip any node that's already seen.
    - For an unseen node, add one to the count.
    - Search from it, marking everything it reaches as seen.
  terms:
    - term: Part
      definition: A group of nodes that can all reach each other, with no edge leading out.
  lesson:
    title: One search per part
    explanation: Each search marks a whole part, so only the first node of each part starts one. Every node is still marked once, so it's O(n + m).
- id: when-two-teams-fail
  skill: graph-dfs
  asks: when
  type: pick-one
  prompt: Nodes joined by an edge must go on opposite sides. Which graph can't be split that way?
  reworded: Splitting a graph into two sides so every edge crosses between them fails for one of these. Which?
  options:
    - text: Three nodes joined in a triangle
      correct: true
      reason: A cycle with an odd number of edges forces two neighbours onto the same side.
    - text: Four nodes joined in a ring
      reason: Sides can go one, two, one, two around a ring of four.
    - text: Five nodes in a line
      reason: A line has no cycle, so the sides just alternate.
  lesson:
    title: Odd cycles break the split
    explanation: Give each node the other colour from the node that found it. Meeting an edge between two nodes of the same colour means there's an odd cycle.
- id: why-bfs-not-weighted
  skill: graph-bfs
  asks: why
  type: prompt
  prompt: Why does breadth-first search give the fewest edges to every node, but not the cheapest path when edges cost different amounts?
  reworded: Breadth-first search finds shortest paths in some graphs but not others. What's the difference?
  points:
    - It takes nodes in order of how many edges away they are, so the first time it reaches a node is by the fewest edges.
    - When every edge costs the same, fewest edges means cheapest.
    - With different costs, a path of more cheap edges can beat a path of fewer dear ones, so it needs Dijkstra's algorithm with a heap.
  lesson:
    title: Fewest edges is not always cheapest
    explanation: The queue keeps nodes in order of edge count. That only matches cost when every edge costs the same.
- id: when-dfs-path-wrong
  skill: graph-bfs
  asks: when
  type: pick-one
  prompt: A depth-first search from the start reaches the goal. When is the path it took the shortest one?
  reworded: Can you trust the first path a depth-first search finds to the goal to be the fewest steps?
  options:
    - text: Only by luck, so use a breadth-first search when the question asks for the fewest
      correct: true
      reason: Depth-first goes far down whichever branch it tries first, which may be a long way round.
    - text: Always, as long as it marks nodes as seen
      reason: Marking stops loops, but it doesn't change which way the search goes first.
    - text: Always on a grid
      reason: On a grid it can wind all over before reaching a goal right next to the start.
  lesson:
    title: Fewest means breadth first
    explanation: Depth-first search answers "can I get there?". Breadth-first search answers "in how few steps?".
- id: grid-bfs-steps
  skill: graph-bfs
  asks: what
  type: ordering
  prompt: Put the steps for finding the fewest steps across a grid in order.
  reworded: In what order does a breadth-first search across a grid do its work?
  steps:
    - Check the start and the goal are open cells.
    - Give the start a distance of 0 and put it in the queue.
    - Take the cell at the front of the queue.
    - For each neighbour inside the grid that's open and unseen, set its distance one higher and add it to the queue.
    - Stop when the goal comes out of the queue, or answer -1 when the queue empties.
  lesson:
    title: Check, mark, and spread
    explanation: The bounds check comes before reading a neighbour, and the distance is set as a cell joins the queue, so no cell joins twice.
- id: why-all-sources-first
  skill: multi-source-bfs
  asks: why
  type: prompt
  prompt: To find each cell's distance to its nearest exit, why put every exit in the queue at distance 0 before the search starts?
  reworded: In a breadth-first search from many starting points, what does starting them all together give you?
  points:
    - The search spreads from every exit at once, one step at a time.
    - So each cell is first reached from whichever exit is nearest, and that's its distance.
    - It's one search, O(n + m), instead of one search per exit.
  misconception: That you need a separate search from each exit and then the smallest result for each cell.
  lesson:
    title: One search, many starts
    explanation: It works as if one extra node were joined to every exit and the search started there.
- id: when-multi-source
  skill: multi-source-bfs
  asks: when
  type: matching
  prompt: Match each question to the search that fits it.
  reworded: Which kind of search answers each of these questions?
  matchHeading: Search
  matchName: a search
  pairs:
    - item: How far is every room from its nearest fire exit?
      match: One breadth-first search from every exit at once
    - item: How few steps from the front door to the kitchen?
      match: One breadth-first search from the front door
    - item: Is the kitchen reachable from the front door at all?
      match: Any search from the front door
  extraMatches:
    - A sort of the rooms by size
  lesson:
    title: Where do you start?
    explanation: The question tells you where the search starts. Many starting points can all go in the queue together.
- id: when-spread-never-ends
  skill: multi-source-bfs
  asks: when
  type: pick-one
  prompt: Frost spreads from every frozen seedling to its neighbours each hour. When is the answer -1?
  reworded: In the spreading problem, what makes the right answer "never"?
  options:
    - text: When a healthy seedling is walled off so the search never reaches it
      correct: true
      reason: After the search ends, any healthy seedling still unreached will never freeze.
    - text: When there are no frozen seedlings and no healthy ones
      reason: Nothing needs to freeze, so the answer is 0 hours.
    - text: When two frozen seedlings are far apart
      reason: They spread at the same time, so the gap only changes how long it takes.
  lesson:
    title: Count what's left
    explanation: Count the healthy seedlings first and subtract one each time the frost reaches one. If any are left at the end, answer -1.
- id: why-seen-not-enough-directed
  skill: graph-cycles
  asks: why
  type: prompt
  prompt: "In a directed graph, why isn't reaching a seen node enough to say there's a cycle?"
  reworded: "A search of a directed graph comes across a node it has already visited. Why doesn't that prove a cycle?"
  points:
    - "Two separate paths can lead to the same node, like `0 → 1 → 3` and `0 → 2 → 3`."
    - That node is reached twice, but no path leads back to where it started.
    - A cycle means an edge back to a node that's still on the current path, which needs three states to spot.
  misconception: That the seen check from an undirected search also finds cycles in directed graphs.
  lesson:
    title: Two ways in isn't a loop
    explanation: Mark nodes as not started, in progress, or done. An edge to an in-progress node closes a cycle. An edge to a done node is just another way in.
- id: which-edge-is-a-cycle
  skill: graph-cycles
  asks: what
  type: pick-one
  prompt: A depth-first search of a directed graph marks each node not started, in progress, or done. Which edge means there's a cycle?
  reworded: With three states per node, which kind of edge shows a directed cycle?
  options:
    - text: An edge to a node that's in progress
      correct: true
      reason: That node is on the current path, so the path has come back around to it.
    - text: An edge to a node that's done
      reason: A done node's search finished, so this is just a second way in.
    - text: An edge to a node that's not started
      reason: That's an ordinary step forward in the search.
  lesson:
    title: Back to the current path
    explanation: In progress means the search is still below that node. Reaching it again means following edges has looped.
- id: when-edge-closes-loop
  skill: graph-cycles
  asks: when
  type: pick-one
  prompt: Adding the edges of an undirected graph to union-find one at a time, when does an edge close a cycle?
  reworded: In an undirected graph built edge by edge with union-find, which edge makes a cycle?
  options:
    - text: When both of its ends already have the same root
      correct: true
      reason: There's already a path between them, and this edge makes a second one.
    - text: When one of its ends has a rank of 0
      reason: Rank is only about tree height inside union-find.
    - text: When it joins two groups of the same size
      reason: Joining two separate groups never makes a cycle.
  lesson:
    title: Already joined means a loop
    explanation: "`union` returning false is the signal. The first edge to do that is the one that closes the first cycle."
- id: kahn-steps
  skill: topological-order
  asks: what
  type: ordering
  prompt: Put the steps of Kahn's algorithm in order.
  reworded: In what order does Kahn's algorithm build a topological order?
  steps:
    - Count how many prerequisites each node is waiting on.
    - Put every node with a count of 0 in a queue.
    - Take a node from the queue and add it to the order.
    - Lower the count of every node it points to, and queue any that reach 0.
    - If the order holds fewer than n nodes, the rest are in a cycle.
  terms:
    - term: Topological order
      definition: A list of the nodes where every edge points from earlier to later.
  lesson:
    title: Start with what's ready
    explanation: A node is ready once nothing it needs is still waiting. Taking ready nodes and freeing what they unlock gives a valid order in O(n + m).
- id: why-kahn-leaves-cycles
  skill: topological-order
  asks: why
  type: pick-one
  prompt: Why does Kahn's algorithm leave out the nodes on a cycle?
  reworded: When the graph has a cycle, what stops Kahn's algorithm from placing those nodes?
  options:
    - text: Each node on the cycle waits on the one before it, so none of their counts ever reaches 0
      correct: true
      reason: To be ready, a node needs its prerequisites placed first, and around a cycle nobody goes first.
    - text: The queue runs out of space
      reason: The queue holds at most n nodes. It simply never gets them.
    - text: It skips nodes that have more than one prerequisite
      reason: Those are placed fine once all their prerequisites are.
  lesson:
    title: Nobody goes first
    explanation: That's why checking whether the order has all n nodes is a cycle test for free.
- id: when-edge-direction
  skill: topological-order
  asks: when
  type: pick-one
  prompt: '"Course a needs course b first." Which way should the edge go?'
  reworded: '"You have to pass b before you can take a." Where does the edge start and end?'
  options:
    - text: From b to a, since b comes first
      correct: true
      reason: Edges point from what's done earlier to what it unlocks.
    - text: From a to b, since a mentions b
      reason: That's the order the sentence is written in, but it makes the order come out backward.
    - text: Both ways
      reason: A two-way edge would be a cycle of two, and no order would exist.
  lesson:
    title: Point from first to next
    explanation: Read each pair carefully. Getting one arrow backward reverses the whole order.
- id: why-compress-and-rank
  skill: union-find
  asks: why
  type: prompt
  prompt: What do path compression and union by rank each do for union-find, and why do you want both?
  reworded: Why does union-find use both path compression and union by rank?
  points:
    - Union by rank hangs the shorter tree under the taller, so trees stay shallow as groups join.
    - Path compression points every node a find passes straight at the root, so the next find is one step.
    - Without them a run of unions can make one long chain and finds become O(n). With both, each call is about O(1).
  lesson:
    title: Short chains, fast finds
    explanation: Each trick helps alone, and together the cost per call grows so slowly that it's at most 4 steps for any graph that fits in memory.
- id: when-union-find
  skill: union-find
  asks: when
  type: matching
  prompt: Match each task to the tool that suits it.
  reworded: For each of these, would you reach for union-find or a search?
  matchHeading: Tool
  matchName: a tool
  pairs:
    - item: Count islands after each new cell of land rises
      match: Union-find
    - item: Find the fewest steps across a maze
      match: Breadth-first search
    - item: Count islands on one finished map
      match: Either a search or union-find
  extraMatches:
    - A heap
  lesson:
    title: Union-find shines as things join
    explanation: When edges arrive one at a time and you need answers in between, a search would start over each time. Union-find keeps its groups up to date. It can't find paths or split groups, though.
